<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free GST Invoice &amp; Bill Generator for Freelancers in India | BillKul</title>
    <meta
      name="description"
      content="Create GST invoices and bills online in two minutes. CGST + SGST or IGST worked out from the GSTIN, export invoices under LUT, a UPI QR for payment and a PDF download. Free, no sign-up."
    />
    <!--site-head-->
    <style>
      /* Splash and loader. Inline so they show before any JS or CSS downloads.
         Also used by src/components/Loader.tsx. */
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #fbfaf8; color: #1a1917;
        font: 600 15px/1 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.01em;
        transition: opacity 0.3s ease, visibility 0.3s;
      }
      #splash.is-done { opacity: 0; visibility: hidden; }
      .sp-body { fill: #b0262c; }
      .sp-line {
        fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: 1.8s ease-in-out infinite both;
      }
      .sp-line:nth-of-type(2) { animation-name: bk-write-1; }
      .sp-line:nth-of-type(3) { animation-name: bk-write-2; }
      .sp-line:nth-of-type(4) { animation-name: bk-write-3; }
      /* Lines are written one after another, held, then cleared together */
      @keyframes bk-write-1 { 0% { stroke-dashoffset: 1; opacity: 1; } 20%, 78% { stroke-dashoffset: 0; opacity: 1; } 92%, 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes bk-write-2 { 0%, 18% { stroke-dashoffset: 1; opacity: 1; } 38%, 78% { stroke-dashoffset: 0; opacity: 1; } 92%, 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes bk-write-3 { 0%, 36% { stroke-dashoffset: 1; opacity: 1; } 52%, 78% { stroke-dashoffset: 0; opacity: 1; } 92%, 100% { stroke-dashoffset: 0; opacity: 0; } }
      .loader {
        flex: 1; min-height: 50vh;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        font-size: 13px; color: #8b877f;
      }
      @media (prefers-color-scheme: dark) {
        #splash { background: #151514; color: #ecebe7; }
        .sp-body { fill: #e8686d; }
        .loader { color: #7c786f; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sp-line { animation: none; stroke-dashoffset: 0; }
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "BillKul",
        "url": "https://bill-kul.vercel.app/",
        "description": "Free GST invoice and bill generator for Indian freelancers and small businesses. Works out CGST, SGST and IGST, supports export invoices under LUT and prints a UPI QR code for payment.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (runs in the browser)",
        "inLanguage": "en-IN",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "featureList": [
          "GST tax invoice with CGST + SGST, UTGST or IGST",
          "Export of services under LUT with the required declaration",
          "Invoice for freelancers not registered under GST",
          "GSTIN validation with checksum",
          "UPI QR code with the invoice amount",
          "PDF download, four invoice designs, your logo"
        ]
      }
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="sp-mark" width="64" height="64" viewBox="0 0 24 24">
        <path class="sp-body" d="M5 2.5h14a1 1 0 0 1 1 1v18l-2.67-1.6-2.66 1.6L12 19.9l-2.67 1.6-2.66-1.6L4 21.5v-18a1 1 0 0 1 1-1Z" />
        <path class="sp-line" pathLength="1" d="M8 8h8" />
        <path class="sp-line" pathLength="1" d="M8 11.5h8" />
        <path class="sp-line" pathLength="1" d="M8 15h4.5" />
      </svg>
      <span>BillKul</span>
    </div>
    <noscript><style>#splash { display: none; }</style></noscript>
    <script>
      // Safety net: never leave the splash up if the app fails to start.
      setTimeout(function () { var s = document.getElementById("splash"); if (s) s.remove(); }, 10000);
    </script>
    <div id="root">
      <noscript>
        <h1>Free GST invoice and bill generator for freelancers</h1>
        <p>
          BillKul makes GST tax invoices in your browser: CGST + SGST or IGST from the GSTIN, export invoices under LUT
          and a UPI QR code. Please enable JavaScript to use it. You can also read the
          <a href="/gst-invoice-format/">GST invoice format guide</a>, use the
          <a href="/gst-calculator/">GST calculator</a> or the <a href="/gstin-validator/">GSTIN checker</a>.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
